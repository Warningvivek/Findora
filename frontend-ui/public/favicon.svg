<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="amb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4fc3f7" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#7c6aff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f06292" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gl" cx="35%" cy="28%" r="70%">
      <stop offset="0%"   stop-color="#8899ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#3a3fbf" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="orb" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#ff9a4c"/>
      <stop offset="100%" stop-color="#f06292"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <ellipse cx="40" cy="40" rx="38" ry="35" fill="url(#amb)" filter="url(#blur)"/>
  <circle cx="40" cy="40" r="27" fill="url(#gl)" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <circle cx="37" cy="36" r="7.5" stroke="white" stroke-width="2.4" fill="none"/>
  <line x1="42.5" y1="42.5" x2="49.5" y2="49.5" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- rays -->
  <line x1="37" y1="19" x2="37" y2="23"  stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="37" y1="49" x2="37" y2="53"  stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="36" x2="24" y2="36"  stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="36" x2="54" y2="36"  stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round"/>
  <!-- accent orbs -->
  <circle cx="64" cy="20" r="4.2" fill="#4fc3f7" opacity="0.92"/>
  <circle cx="21" cy="57" r="5.8" fill="url(#orb)" opacity="0.92"/>
  <circle cx="17" cy="27" r="3.5" fill="#4fc3f7" opacity="0.55"/>
